name = "da-sc"
main = "src/index.ts"
compatibility_date = "2025-07-10"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

[vars]
VERSION = "@@VERSION@@-dev"
ENVIRONMENT = "dev"
# JSON Schemas: no caching on workers.dev. Source, token and canonical origin are
# set locally in .dev.vars (see README.md).
JSON_SCHEMA_CACHE_MODE = "bypass"

# CI environment
[env.ci]
name = "da-sc-ci"
[env.ci.vars]
VERSION = "@@VERSION@@-ci"
ENVIRONMENT = "ci"
JSON_SCHEMA_CACHE_MODE = "bypass"

# Production environment
[env.production]
name = "da-sc"
[env.production.vars]
VERSION = "@@VERSION@@"
ENVIRONMENT = "production"