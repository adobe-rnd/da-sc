name = "da-sc"
main = "src/index.ts"
compatibility_date = "2025-07-10"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

# Persist logs so they can be searched in the Cloudflare dashboard (Workers Logs).
[observability]
enabled = true
head_sampling_rate = 1

[vars]
VERSION = "@@VERSION@@-dev"
ENVIRONMENT = "dev"

# Worker-wide opt-in for token caching and forwarding X-Push-Invalidation.
# Before enabling it, verify login before shared-cache lookup. CDNs should
# request the longer TTL only after verifying tag purges for cached 200s and 404s.
ENABLE_EDS_AUTH_CACHE_AND_PUSH_INVALIDATION = false

# CI environment
[env.ci]
name = "da-sc-ci"
[env.ci.vars]
VERSION = "@@VERSION@@-ci"
ENVIRONMENT = "ci"
ENABLE_EDS_AUTH_CACHE_AND_PUSH_INVALIDATION = true

# Production environment
[env.production]
name = "da-sc"
[env.production.vars]
VERSION = "@@VERSION@@"
ENVIRONMENT = "production"
ENABLE_EDS_AUTH_CACHE_AND_PUSH_INVALIDATION = false
